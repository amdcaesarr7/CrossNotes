<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Gravitational Force Between Two Masses</title>
  <desc id="desc">Two spherical masses m1 and m2 separated by distance d with attractive forces F acting towards each other.</desc>
  <defs>
    <radialGradient id="m1Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <radialGradient id="m2Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background grid/space atmosphere -->
  <rect width="640" height="320" rx="16" fill="#0f172a" />
  <circle cx="120" cy="60" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="520" cy="80" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="300" cy="240" r="1" fill="#ffffff" opacity="0.5" />

  <!-- Center line / Distance d -->
  <line x1="160" y1="160" x2="480" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Mass m1 -->
  <circle cx="160" cy="160" r="55" fill="url(#m1Grad)" stroke="#10b981" stroke-width="3" />
  <text x="160" y="165" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">m₁</text>

  <!-- Mass m2 -->
  <circle cx="480" cy="160" r="40" fill="url(#m2Grad)" stroke="#8b5cf6" stroke-width="3" />
  <text x="480" y="165" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">m₂</text>

  <!-- Force arrows pointing towards each other -->
  <line x1="225" y1="160" x2="295" y2="160" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)" />
  <text x="260" y="145" font-family="sans-serif" font-weight="800" font-size="14" fill="#f59e0b" text-anchor="middle">F</text>

  <line x1="430" y1="160" x2="360" y2="160" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)" />
  <text x="395" y="145" font-family="sans-serif" font-weight="800" font-size="14" fill="#f59e0b" text-anchor="middle">F</text>

  <!-- Distance indicator bracket -->
  <path d="M 160 230 L 160 245 L 480 245 L 480 230" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text x="320" y="270" font-family="sans-serif" font-weight="700" font-size="16" fill="#cbd5e1" text-anchor="middle">Distance (d)</text>
</svg>
