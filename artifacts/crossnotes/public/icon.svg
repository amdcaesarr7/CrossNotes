<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CrossNotes — Mew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5399a"/>
      <stop offset="1" stop-color="#8f2e78"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1e4"/>
      <stop offset="1" stop-color="#e7cba6"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07b52"/>
      <stop offset="1" stop-color="#8a5a3b"/>
    </linearGradient>
  </defs>

  <!-- Branded rounded-square background (rounded corners for `purpose: any`) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mew, drawn from MewMascot (viewBox 0 0 100 122), scaled into the tile.
       transform: translate then scale 2.78 → ~278x340 centred. -->
  <g transform="translate(116.6 86) scale(2.786)">
    <!-- Stubby arms peeking from behind the body -->
    <g fill="url(#face)" stroke="#8a5a3b" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="17" cy="74" rx="6.5" ry="9"/>
      <ellipse cx="83" cy="74" rx="6.5" ry="9"/>
    </g>

    <!-- Rounded ears, behind the head -->
    <g stroke="#8a5a3b" stroke-width="2.3">
      <circle cx="33" cy="17" r="10" fill="url(#ear)"/>
      <circle cx="67" cy="17" r="10" fill="url(#ear)"/>
    </g>
    <ellipse cx="33" cy="16" rx="4.2" ry="5" fill="#ecb79a"/>
    <ellipse cx="67" cy="16" rx="4.2" ry="5" fill="#ecb79a"/>

    <!-- Pear body — head + body as one soft gourd silhouette -->
    <path d="M71 55.3 A26 26 0 1 0 29 55.3 A34 34 0 1 0 71 55.3 Z"
          fill="url(#face)" stroke="#8a5a3b" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Soft belly -->
    <ellipse cx="50" cy="86" rx="20" ry="23" fill="#fff6ea" opacity="0.6"/>

    <!-- Little feet -->
    <g fill="url(#face)" stroke="#8a5a3b" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="40" cy="114" rx="8" ry="5.5"/>
      <ellipse cx="60" cy="114" rx="8" ry="5.5"/>
    </g>

    <!-- Blush -->
    <ellipse cx="32" cy="49" rx="6.5" ry="3.8" fill="#f2a7a0" opacity="0.72"/>
    <ellipse cx="68" cy="49" rx="6.5" ry="3.8" fill="#f2a7a0" opacity="0.72"/>

    <!-- Cheery face -->
    <ellipse cx="39" cy="42" rx="6" ry="7.8" fill="#3a281d"/>
    <ellipse cx="61" cy="42" rx="6" ry="7.8" fill="#3a281d"/>
    <circle cx="36.8" cy="38.6" r="2" fill="#fff"/>
    <circle cx="58.8" cy="38.6" r="2" fill="#fff"/>
    <ellipse cx="50" cy="48.5" rx="2.2" ry="1.6" fill="#7c4f31"/>
    <path d="M43 51 Q46.5 55.4 50 51 Q53.5 55.4 57 51"
          fill="none" stroke="#7c4f31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
